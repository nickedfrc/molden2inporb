name: tests
on: [push, pull_request]
jobs:
  modern-python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error -m unittest discover -s tests -v
  python36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test with CPython 3.6
        run: docker run --rm -v "$PWD:/work" -w /work python:3.6.15-slim python -W error -m unittest discover -s tests -v
